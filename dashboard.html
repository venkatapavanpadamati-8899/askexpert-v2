<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AskExpert | Routing to Session...</title>
  <link rel="stylesheet" href="./assets/css/styles.css" />
  <style>
    body {
      background: var(--ae-mesh-cosmic);
      color: #ffffff;
      font-family: 'Inter', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .spinner-ring {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(0, 217, 255, 0.2);
      border-top-color: #00d9ff;
      border-right-color: #7952ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script type="module">
    import { supabase } from "./assets/js/common/supabaseClient.js";

    async function routeDashboard() {
      try {
        if (!supabase) {
          window.location.replace("login.html");
          return;
        }

        const { data: { session }, error } = await supabase.auth.getSession();
        if (error || !session?.user) {
          window.location.replace("login.html");
          return;
        }

        const { data: prof, error: profError } = await supabase
          .from("profiles")
          .select("role, is_verified, account_status, is_blocked")
          .eq("id", session.user.id)
          .maybeSingle();

        if (prof?.account_status === "suspended" || prof?.account_status === "blocked" || prof?.is_blocked === true) {
          await supabase.auth.signOut();
          sessionStorage.clear();
          localStorage.removeItem("askexpert_user_id");
          localStorage.removeItem("askexpert_user_role");
          window.location.replace("login.html");
          return;
        }

        const role = prof?.role || "user";

        if (role === "admin") {
          window.location.replace("admin-dashboard.html");
        } else if (role === "expert" || role === "professional") {
          if (prof?.is_verified !== true) {
            window.location.replace("professional-verification.html");
          } else {
            window.location.replace("professional-dashboard.html");
          }
        } else {
          window.location.replace("user-dashboard.html");
        }
      } catch (e) {
        window.location.replace("login.html");
      }
    }

    routeDashboard();
  </script>
</head>
<body>
  <div class="spinner-ring"></div>
  <p style="font-size: 14px; font-weight: 600; color: #bad3eb; letter-spacing: 0.5px;">Authenticating & Routing to Dashboard...</p>
</body>
</html>
