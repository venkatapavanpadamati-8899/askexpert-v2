<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AskExpert - Edit Profile. Update your contact details, consultation languages, and personal bio." />
  <title>AskExpert | Edit Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
       ASKEXPERT - EDIT PROFILE STYLES (ORCHID & NEON ROSE)
       ========================================================= */
    :root {
      --bg-1: #0f0417;
      --bg-2: #1c082b;
      --bg-3: #240a25;
      --card-bg: rgba(22, 10, 36, 0.88);
      --card-inner: rgba(255, 255, 255, 0.04);
      --card-border: rgba(168, 85, 247, 0.22);
      --card-hover: rgba(168, 85, 247, 0.5);

      --white: #ffffff;
      --text: #fdf4ff;
      --muted: #cbd5e1;
      --cyan: #38bdf8;
      --blue: #818cf8;
      --purple: #c084fc;
      --green: #34d399;
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      color: var(--text);
      background: var(--ae-mesh-orchid);
      background-attachment: fixed;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button, input, textarea, select {
      font: inherit;
    }

    .container {
      width: min(720px, 94%);
      margin: 0 auto;
    }

    /* Top Navbar */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: rgba(4, 10, 22, 0.88);
      border-bottom: 1px solid var(--card-border);
    }

    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 70px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 850;
      color: var(--white);
    }

    .brand span:last-child {
      color: var(--cyan);
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      color: #030d1a;
      display: grid;
      place-items: center;
      font-size: 14px;
      font-weight: 900;
    }

    /* Page Layout */
    .edit-page-shell {
      padding: 40px 0 60px;
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 36px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    .form-header {
      margin-bottom: 26px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 16px;
    }

    .form-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 8px;
      background: rgba(0, 217, 255, 0.12);
      border: 1px solid rgba(0, 217, 255, 0.3);
      color: var(--cyan);
      font-size: 11.5px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .form-title {
      font-size: 24px;
      font-weight: 900;
      color: var(--white);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    @media (max-width: 600px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    .form-label {
      font-size: 12.5px;
      font-weight: 750;
      color: #bad3eb;
    }

    .form-input, .form-textarea {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--white);
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input:focus, .form-textarea:focus {
      border-color: var(--cyan);
      background: rgba(0, 217, 255, 0.05);
      box-shadow: 0 0 0 3px rgba(0, 217, 255, 0.15);
    }

    .form-textarea {
      resize: vertical;
      min-height: 110px;
    }

    .btn-actions-row {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 28px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 24px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 750;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--blue), var(--cyan));
      color: #031120;
      box-shadow: 0 4px 14px rgba(0, 153, 255, 0.35);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 217, 255, 0.5);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      color: var(--text);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    /* Toast */
    .toast-pill {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 12px 20px;
      background: #0f1c30;
      border: 1px solid var(--cyan);
      border-radius: 12px;
      color: #ffffff;
      font-size: 13.5px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      z-index: 200;
      display: none;
      animation: toastIn 0.3s ease;
    }

    @media (max-width: 600px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
      .glass-card {
        padding: 20px 16px;
      }
      .btn-actions-row {
        flex-direction: column;
      }
      .btn-actions-row .btn {
        width: 100%;
        justify-content: center;
      }
    }

    @media (max-width: 480px) {
      .navbar {
        height: auto;
        padding: 10px 0;
      }
      .brand {
        font-size: 18px;
      }
      .brand-mark {
        width: 32px;
        height: 32px;
      }
      .form-title {
        font-size: 22px;
      }
    }
  </style>
  <script type="module" crossorigin src="/assets/editProfile-BKY8a_g9.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/supabaseClient-Di3C5gu9.js">
  <link rel="stylesheet" crossorigin href="/assets/styles-XX9Cy3k1.css">
</head>
<body>

  <!-- Top Navbar -->
  <header class="topbar">
    <div class="container navbar">
      <a href="index.html" class="brand">
        <span class="brand-mark">A</span>
        Ask<span>Expert</span>
      </a>
      <nav style="display: flex; gap: 8px;">
        <a href="user-dashboard.html" style="font-size: 13.5px; font-weight: 700; color: var(--muted); padding: 8px 12px;">Dashboard</a>
        <a href="profile.html" style="font-size: 13.5px; font-weight: 700; color: var(--cyan); padding: 8px 12px;">My Profile</a>
      </nav>
    </div>
  </header>

  <main class="container edit-page-shell">
    <div class="glass-card">
      <div class="form-header">
        <span class="form-badge">👤 Profile Settings</span>
        <h1 class="form-title">Edit Your Profile</h1>
      </div>

      <form id="editProfileForm">
        <div class="form-grid">
          <div class="form-group">
            <label class="form-label" for="inputFullName">Full Legal Name</label>
            <input type="text" id="inputFullName" class="form-input" placeholder="e.g. Aditya Sharma" required />
          </div>

          <div class="form-group">
            <label class="form-label" for="inputPhone">Phone Number</label>
            <input type="tel" id="inputPhone" class="form-input" placeholder="e.g. +91 98765 43210" />
          </div>

          <div class="form-group full">
            <label class="form-label" for="inputLanguages">Preferred Languages (comma separated)</label>
            <input type="text" id="inputLanguages" class="form-input" placeholder="e.g. English, Hindi, Marathi" />
          </div>

          <div class="form-group full">
            <label class="form-label" for="inputBio">Personal Bio / Consultation Notes</label>
            <textarea id="inputBio" class="form-textarea" placeholder="Tell experts about your business, projects, or consultation goals..."></textarea>
          </div>

          <!-- PRIVACY & COMMUNICATION SETTINGS -->
          <div class="form-group full" style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px; margin-top: 10px;">
            <h3 style="font-size: 15px; font-weight: 700; color: #00d9ff; margin-bottom: 12px; display: flex; align-items: center; gap: 8px;">
              <span>🔒</span> Privacy & Direct Messaging Controls
            </h3>
          </div>

          <div class="form-group">
            <label class="form-label" for="selectWhoCanMessage">Who Can Message You</label>
            <select id="selectWhoCanMessage" class="form-input" style="background: rgba(255,255,255,0.05); color: #fff;">
              <option value="everyone">🌐 Everyone (Users & Specialists)</option>
              <option value="verified_experts_only">⚖️ Verified Specialists Only</option>
              <option value="nobody">🚫 Nobody (Disable Inbound Messages)</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="selectProfileVisibility">Profile Visibility</label>
            <select id="selectProfileVisibility" class="form-input" style="background: rgba(255,255,255,0.05); color: #fff;">
              <option value="public">🌍 Public (Visible in Directory)</option>
              <option value="verified_experts_only">🛡️ Verified Specialists Only</option>
              <option value="private">🔒 Private (Hidden from Directory)</option>
            </select>
          </div>

          <div class="form-group full" style="display: flex; gap: 24px; margin-top: 4px;">
            <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text); cursor: pointer;">
              <input type="checkbox" id="checkOnlineStatus" checked />
              <span>Show online status indicator</span>
            </label>
            <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text); cursor: pointer;">
              <input type="checkbox" id="checkReadReceipts" checked />
              <span>Send read receipts in chats</span>
            </label>
          </div>
        </div>

        <div class="btn-actions-row">
          <a href="profile.html" class="btn btn-secondary">Cancel</a>
          <button type="submit" id="saveProfileBtn" class="btn btn-primary">
            <span>💾</span> Save Changes
          </button>
        </div>
      </form>
    </div>
  </main>

  <div id="toastPill" class="toast-pill"></div>

  <!-- Supabase Update Script -->
</body>
</html>
