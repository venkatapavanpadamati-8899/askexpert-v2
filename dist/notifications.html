<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AskExpert - Live Notification Center. Instant alerts on expert answers, live chat messages, and payment receipts." />
  <title>AskExpert | Notification Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
       ASKEXPERT - NOTIFICATIONS CENTER STYLES (DEEP TEAL)
       ========================================================= */
    :root {
      --bg-1: #03141a;
      --bg-2: #05212b;
      --bg-3: #031821;
      --card-bg: rgba(7, 26, 33, 0.88);
      --card-inner: rgba(255, 255, 255, 0.04);
      --card-border: rgba(13, 148, 136, 0.25);
      --card-hover: rgba(6, 182, 212, 0.5);

      --white: #ffffff;
      --text: #f0fdfa;
      --muted: #94a3b8;
      --cyan: #06b6d4;
      --blue: #0ea5e9;
      --purple: #14b8a6;
      --green: #10b981;
      --orange: #ff9d3c;
      --gold: #fbbf24;
      --red: #ff4757;
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      color: var(--text);
      background: var(--ae-mesh-teal);
      background-attachment: fixed;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button, input, select {
      font: inherit;
    }

    .container {
      width: min(880px, 94%);
      margin: 0 auto;
    }

    /* ========================================================
       TOP NAVBAR
       ======================================================== */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: rgba(4, 10, 22, 0.88);
      border-bottom: 1px solid var(--card-border);
    }

    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 70px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 850;
      color: var(--white);
    }

    .brand span:last-child {
      color: var(--cyan);
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      color: #030d1a;
      display: grid;
      place-items: center;
      font-size: 14px;
      font-weight: 900;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-links a {
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--muted);
      transition: all 0.2s ease;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--white);
      background: rgba(0, 153, 255, 0.12);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 750;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      color: var(--text);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    /* ========================================================
       PAGE SHELL
       ======================================================== */
    .page-shell {
      padding: 30px 0 60px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
    }

    .breadcrumb a:hover {
      color: var(--cyan);
    }

    .breadcrumb span.current {
      color: var(--text);
      font-weight: 600;
    }

    /* ========================================================
       HEADER CONTROLS & FILTER TABS
       ======================================================== */
    .notif-header-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.3);
    }

    .header-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
    }

    .header-title-box h1 {
      font-size: 24px;
      font-weight: 850;
      color: var(--white);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .unread-pill {
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 800;
      background: rgba(0, 217, 255, 0.15);
      border: 1px solid rgba(0, 217, 255, 0.35);
      color: var(--cyan);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Filter Tabs */
    .filter-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 14px;
    }

    .filter-tabs::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      padding: 6px 14px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      color: var(--muted);
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      color: var(--white);
      background: rgba(255, 255, 255, 0.08);
    }

    .tab-btn.active {
      background: linear-gradient(135deg, rgba(0, 153, 255, 0.25), rgba(0, 217, 255, 0.15));
      border-color: var(--cyan);
      color: var(--cyan);
      font-weight: 800;
    }

    /* ========================================================
       NOTIFICATIONS LIST
       ======================================================== */
    .notifications-feed {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .notif-item {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 18px 20px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 16px;
      align-items: flex-start;
      transition: all 0.25s ease;
      cursor: pointer;
      position: relative;
    }

    .notif-item:hover {
      border-color: rgba(0, 217, 255, 0.35);
      background: rgba(18, 30, 54, 0.9);
      transform: translateX(3px);
    }

    .notif-item.unread {
      background: linear-gradient(90deg, rgba(0, 153, 255, 0.12), rgba(13, 22, 41, 0.95));
      border-left: 3px solid var(--cyan);
    }

    .notif-icon-box {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .icon-answer { background: rgba(32, 216, 137, 0.15); color: var(--green); border: 1px solid rgba(32, 216, 137, 0.3); }
    .icon-chat { background: rgba(0, 217, 255, 0.15); color: var(--cyan); border: 1px solid rgba(0, 217, 255, 0.3); }
    .icon-payment { background: rgba(255, 183, 3, 0.15); color: var(--gold); border: 1px solid rgba(255, 183, 3, 0.3); }
    .icon-question { background: rgba(138, 92, 255, 0.15); color: var(--purple); border: 1px solid rgba(138, 92, 255, 0.3); }
    .icon-expert { background: rgba(0, 153, 255, 0.15); color: var(--blue); border: 1px solid rgba(0, 153, 255, 0.3); }

    .notif-body {
      display: flex;
      flex-direction: column;
      gap: 3px;
      line-height: 1.4;
    }

    .notif-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .notif-title {
      font-size: 14.5px;
      font-weight: 800;
      color: var(--white);
    }

    .unread-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 8px var(--cyan);
    }

    .notif-message {
      font-size: 13px;
      color: #bad3eb;
    }

    .notif-time {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 4px;
    }

    .notif-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-dismiss {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 16px;
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      transition: all 0.2s;
    }

    .btn-dismiss:hover {
      color: var(--red);
      background: rgba(255, 71, 87, 0.1);
    }

    /* Skeleton */
    .skeleton-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 20px;
      animation: pulse 1.5s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.9; }
    }

    .skeleton-line {
      height: 14px;
      background: rgba(255, 255, 255, 0.07);
      border-radius: 6px;
      margin-bottom: 8px;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
    }

    .empty-icon {
      font-size: 44px;
      margin-bottom: 12px;
    }

    .empty-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--white);
      margin-bottom: 6px;
    }

    .empty-text {
      font-size: 13.5px;
      color: var(--muted);
      margin-bottom: 16px;
    }

    /* Toast */
    .toast-pill {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 12px 20px;
      background: #0f1c30;
      border: 1px solid var(--cyan);
      border-radius: 12px;
      color: #ffffff;
      font-size: 13.5px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      z-index: 200;
      display: none;
      animation: toastIn 0.3s ease;
    }

    .toast-pill.show {
      display: block;
    }

    @keyframes toastIn {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    footer.bottom-bar {
      margin-top: auto;
      border-top: 1px solid var(--card-border);
      background: rgba(3, 7, 18, 0.85);
      padding: 20px 0;
      font-size: 12.5px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 768px) {
      .nav-links {
        display: none;
      }
    }

    @media (max-width: 480px) {
      .navbar {
        height: auto;
        padding: 10px 0;
      }
      .brand {
        font-size: 18px;
      }
      .brand-mark {
        width: 32px;
        height: 32px;
      }
      .header-top-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }
      .tabs-row {
        overflow-x: auto;
        width: 100%;
      }
      .notif-item {
        padding: 14px 12px;
      }
    }
  </style>

  <header class="topbar">
    <div class="container navbar">

  <!-- Main Content -->
  <main class="container page-shell">
    
    <!-- Breadcrumb -->
    <nav class="breadcrumb" aria-label="Breadcrumb">

      <span class="current">Notification Center</span>

    <section class="notif-header-card">
      <div class="header-top-row">

      <div class="filter-tabs" id="notifFilterTabs">

    <section class="notifications-feed" id="notificationsFeed">

  </main>

  <!-- Toast -->

  <!-- Footer -->
  <footer class="bottom-bar">
