<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AskExpert | Settings</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="container navbar">
      <a href="index.html" class="brand"><span class="brand-mark">A</span> Ask<span>Expert</span></a>
      <nav class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="settings.html" class="active">Settings</a>
      </nav>
    </div>
  </header>

  <main class="container page-shell">
    <section class="panel">
      <div class="section-head">
        <h2>Settings</h2>
      </div>
      <form>
        <div class="row">
          <div class="form-group">
            <label class="form-label">Language</label>
            <select>
              <option>English</option>
              <option>తెలుగు</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Theme</label>
            <select>
              <option>Dark</option>
              <option>Light</option>
            </select>
          </div>
        </div>
        <button class="btn btn-primary mt-20" type="submit">Save settings</button>
      </form>
    </section>
  </main>
</body>
</html>
