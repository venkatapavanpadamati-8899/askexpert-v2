<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AskExpert - System & Account Preferences. Customize consultation language, theme, and security controls." />
  <title>AskExpert | System Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/styles.css" />
  <style>
    body {
      min-height: 100vh;
      color: #fdf4ff;
      background: var(--ae-mesh-orchid);
      background-attachment: fixed;
      font-family: 'Inter', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
    }
    .settings-card {
      background: rgba(22, 10, 36, 0.9);
      border: 1.5px solid rgba(168, 85, 247, 0.35);
      border-radius: 20px;
      padding: 36px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 30px rgba(168, 85, 247, 0.15);
      max-width: 720px;
      margin: 40px auto;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 20px;
    }
    .setting-group label {
      font-size: 12.5px;
      font-weight: 750;
      color: #cbd5e1;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: block;
      margin-bottom: 8px;
    }
    .setting-select {
      width: 100%;
      background: #140520;
      border: 1.5px solid rgba(168, 85, 247, 0.3);
      color: #ffffff;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
    }
    .setting-select:focus {
      border-color: #f43f5e;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container navbar">
      <a href="index.html" class="brand"><span class="brand-mark">A</span> Ask<span>Expert</span></a>
      <nav class="nav-links">
        <a href="user-dashboard.html">Dashboard</a>
        <a href="profile.html">Profile</a>
        <a href="settings.html" class="active">Settings</a>
      </nav>
    </div>
  </header>

  <main class="container page-shell">
    <section class="settings-card">
      <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 16px;">
        <span style="font-size: 28px;">⚙️</span>
        <div>
          <h2 style="font-size: 22px; font-weight: 850; color: #ffffff; margin: 0;">Account & System Settings</h2>
          <p style="font-size: 13px; color: #cbd5e1; margin: 4px 0 0;">Manage your personal interface, regional dialects, and notification frequencies.</p>
        </div>
      </div>

      <form onsubmit="event.preventDefault(); alert('Settings preferences saved successfully.');">
        <div class="form-row">
          <div class="setting-group">
            <label>Primary Language</label>
            <select class="setting-select">
              <option value="en">English (Global)</option>
              <option value="te">తెలుగు (Telugu)</option>
              <option value="hi">हिन्दी (Hindi)</option>
            </select>
          </div>
          <div class="setting-group">
            <label>Interface Theme</label>
            <select class="setting-select">
              <option value="cosmic">Cosmic Multi-Palette (Default)</option>
              <option value="sapphire">Cyber Sapphire</option>
              <option value="aurora">Emerald Aurora</option>
            </select>
          </div>
        </div>

        <div style="margin-top: 24px;">
          <label style="font-size: 12.5px; font-weight: 750; color: #cbd5e1; text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 12px;">Security & Privacy</label>
          <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; background: rgba(255,255,255,0.03); border: 1px solid rgba(168, 85, 247, 0.2); border-radius: 12px;">
            <div>
              <strong style="font-size: 13.5px; color: #ffffff; display: block;">Hardware Session Biometric Shield</strong>
              <span style="font-size: 12px; color: #94a3b8;">Require PIN verification for direct audio consultations</span>
            </div>
            <input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #a855f7;">
          </div>
        </div>

        <button class="btn" type="submit" style="margin-top: 28px; width: 100%; justify-content: center; background: linear-gradient(135deg, #a855f7, #f43f5e); color: #ffffff; font-weight: 800; padding: 12px; border-radius: 12px; border: none; cursor: pointer; box-shadow: 0 4px 16px rgba(168, 85, 247, 0.4);">
          Save Preferences
        </button>
      </form>
    </section>
  </main>
</body>
</html>
