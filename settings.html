<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AskExpert - System & Account Preferences. Customize consultation language, theme, and security controls." />
  <title>AskExpert | System Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/styles.css" />
  <style>
    body {
      min-height: 100vh;
      color: #fdf4ff;
      background: var(--ae-mesh-orchid);
      background-attachment: fixed;
      font-family: 'Inter', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
    }
    .settings-card {
      background: rgba(22, 10, 36, 0.9);
      border: 1.5px solid rgba(168, 85, 247, 0.35);
      border-radius: 20px;
      padding: 36px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 30px rgba(168, 85, 247, 0.15);
      max-width: 720px;
      margin: 40px auto;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 20px;
    }
    .setting-group label {
      font-size: 12.5px;
      font-weight: 750;
      color: #cbd5e1;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: block;
      margin-bottom: 8px;
    }
    .setting-select {
      width: 100%;
      background: #140520;
      border: 1.5px solid rgba(168, 85, 247, 0.3);
      color: #ffffff;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
    }
    .setting-select:focus {
      border-color: #f43f5e;
    }
    .settings-toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: linear-gradient(135deg, #a855f7, #f43f5e);
      color: #fff;
      font-size: 13.5px;
      font-weight: 700;
      padding: 12px 28px;
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(168, 85, 247, 0.45);
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none;
      z-index: 9999;
    }
    .settings-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container navbar">
      <a href="index.html" class="brand"><span class="brand-mark">A</span> Ask<span>Expert</span></a>
      <nav class="nav-links">
        <a href="user-dashboard.html">Dashboard</a>
        <a href="profile.html">Profile</a>
        <a href="settings.html" class="active">Settings</a>
      </nav>
    </div>
  </header>

  <main class="container page-shell">
    <section class="settings-card">
      <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 16px;">
        <span style="font-size: 28px;">⚙️</span>
        <div>
          <h2 style="font-size: 22px; font-weight: 850; color: #ffffff; margin: 0;">Account &amp; System Settings</h2>
          <p style="font-size: 13px; color: #cbd5e1; margin: 4px 0 0;">Manage your personal interface, regional dialects, and notification frequencies.</p>
        </div>
      </div>

      <form id="settingsForm">
        <div class="form-row">
          <div class="setting-group">
            <label for="prefLanguage">Primary Language</label>
            <select id="prefLanguage" class="setting-select">
              <option value="en">English (Global)</option>
              <option value="te">తెలుగు (Telugu)</option>
              <option value="hi">हिन्दी (Hindi)</option>
            </select>
          </div>
          <div class="setting-group">
            <label for="prefTheme">Interface Theme</label>
            <select id="prefTheme" class="setting-select">
              <option value="cosmic">Cosmic Multi-Palette (Default)</option>
              <option value="sapphire">Cyber Sapphire</option>
              <option value="aurora">Emerald Aurora</option>
            </select>
          </div>
        </div>

        <div style="margin-top: 24px;">
          <label style="font-size: 12.5px; font-weight: 750; color: #cbd5e1; text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 12px;">Security &amp; Privacy</label>
          <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; background: rgba(255,255,255,0.03); border: 1px solid rgba(168, 85, 247, 0.2); border-radius: 12px;">
            <div>
              <strong style="font-size: 13.5px; color: #ffffff; display: block;">Hardware Session Biometric Shield</strong>
              <span style="font-size: 12px; color: #94a3b8;">Require PIN verification for direct audio consultations</span>
            </div>
            <input id="prefBiometric" type="checkbox" style="width: 20px; height: 20px; accent-color: #a855f7;">
          </div>
        </div>

        <button class="btn" type="submit" id="saveSettingsBtn" style="margin-top: 28px; width: 100%; justify-content: center; background: linear-gradient(135deg, #a855f7, #f43f5e); color: #ffffff; font-weight: 800; padding: 12px; border-radius: 12px; border: none; cursor: pointer; box-shadow: 0 4px 16px rgba(168, 85, 247, 0.4);">
          Save Preferences
        </button>
      </form>
    </section>
  </main>

  <!-- Toast -->
  <div id="settingsToast" class="settings-toast">✅ Settings saved successfully!</div>

  <script type="module">
    "use strict";
    import { supabase } from "./assets/js/common/supabaseClient.js";

    const PREFS_KEY = "askexpert_user_prefs";

    /** Load saved preferences from localStorage */
    function loadPreferences() {
      try {
        const saved = JSON.parse(localStorage.getItem(PREFS_KEY) || "{}");
        if (saved.language) document.getElementById("prefLanguage").value = saved.language;
        if (saved.theme)    document.getElementById("prefTheme").value    = saved.theme;
        document.getElementById("prefBiometric").checked =
          typeof saved.biometric === "boolean" ? saved.biometric : true;
      } catch (e) {
        console.warn("Could not load preferences:", e);
      }
    }

    /** Save preferences to localStorage and silently sync to Supabase */
    async function savePreferences(e) {
      e.preventDefault();
      const prefs = {
        language:  document.getElementById("prefLanguage").value,
        theme:     document.getElementById("prefTheme").value,
        biometric: document.getElementById("prefBiometric").checked,
        savedAt:   new Date().toISOString()
      };

      try {
        localStorage.setItem(PREFS_KEY, JSON.stringify(prefs));

        // Silently sync language pref to Supabase profile if session exists
        if (supabase) {
          try {
            const { data: { session } } = await supabase.auth.getSession();
            if (session?.user) {
              await supabase
                .from("profiles")
                .update({ updated_at: new Date().toISOString() })
                .eq("id", session.user.id);
            }
          } catch (_) { /* localStorage save already succeeded — ignore Supabase error */ }
        }

        showToast("✅ Settings saved successfully!");
      } catch (err) {
        console.error("Settings save error:", err);
        showToast("❌ Could not save settings. Please try again.");
      }
    }

    function showToast(msg) {
      const toast = document.getElementById("settingsToast");
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 3000);
    }

    // Init
    loadPreferences();
    document.getElementById("settingsForm").addEventListener("submit", savePreferences);
  </script>
</body>
</html>
